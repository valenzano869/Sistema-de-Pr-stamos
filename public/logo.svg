<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <!-- Gradients for Gold Key and Elements -->
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="35%" stop-color="#FFCA28"/>
      <stop offset="70%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>

    <linearGradient id="logoGoldHighlight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFA000"/>
      <stop offset="60%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFF9C4"/>
    </linearGradient>

    <!-- Magenta / Pink Gradients -->
    <linearGradient id="logoPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A7A"/>
      <stop offset="50%" stop-color="#E91E63"/>
      <stop offset="100%" stop-color="#C2185B"/>
    </linearGradient>

    <!-- Blue / Cyan Gradients -->
    <linearGradient id="logoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C0FF"/>
      <stop offset="50%" stop-color="#0072FF"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>

    <linearGradient id="logoNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Soft Filter -->
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0A2540" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Left Side: Graphic Symbol -->
  <g transform="translate(40, 20)" filter="url(#logoShadow)">
    
    <!-- 1. Rising Line Chart / Trendline (Behind) -->
    <!-- Dark Blue Under-Stroke -->
    <path d="M 160 300 L 220 220 L 270 248 L 330 160" 
          fill="none" stroke="#003B95" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Magenta / Pink Top Stroke -->
    <path d="M 160 300 L 220 220 L 270 248 L 330 160" 
          fill="none" stroke="url(#logoPink)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Magenta Arrowhead at Top of Trendline -->
    <polygon points="345,130 290,150 326,186" fill="url(#logoPink)"/>

    <!-- 2. Circular 3D Ring / Lock (Upper Right of Emblem) -->
    <!-- Pink & Blue Torus -->
    <circle cx="390" cy="180" r="54" fill="none" stroke="url(#logoPink)" stroke-width="20"/>
    <path d="M 390 126 A 54 54 0 0 1 444 180" fill="none" stroke="url(#logoBlue)" stroke-width="20" stroke-linecap="round"/>

    <!-- Dynamic Blue Arrow Swooshing Through the Ring -->
    <path d="M 340 200 C 370 170 410 150 440 140" fill="none" stroke="url(#logoBlue)" stroke-width="14" stroke-linecap="round"/>
    <polygon points="460,130 415,135 440,165" fill="url(#logoBlue)"/>

    <!-- 3. The Golden Key with Dollar Sign Loop -->
    <!-- Teardrop Key Loop at Bottom Left -->
    <path d="M 230 330 C 230 385 185 410 135 410 C 85 410 50 365 50 315 C 50 260 95 240 145 240 C 195 240 230 280 230 330 Z"
          fill="url(#logoGold)"/>
    <!-- Inner cutout of key loop -->
    <path d="M 195 330 C 195 365 165 385 135 385 C 105 385 85 355 85 315 C 85 275 110 265 145 265 C 175 265 195 295 195 330 Z"
          fill="#FFFFFF"/>

    <!-- Golden Dollar Sign Inside Key Loop -->
    <g transform="translate(135, 330) scale(0.9)">
      <!-- Vertical Dollar bar -->
      <rect x="-5" y="-45" width="10" height="90" rx="3" fill="url(#logoGold)"/>
      <!-- S curve of Dollar -->
      <path d="M 18 -20 C 18 -34 -2 -38 -14 -32 C -22 -28 -24 -18 -18 -10 C -12 -2 6 2 16 8 C 30 16 32 30 22 40 C 12 50 -10 50 -22 38 L -14 26 C -4 34 10 34 16 28 C 20 24 18 16 12 12 C 4 6 -12 2 -20 -4 C -30 -12 -28 -28 -18 -38 C -4 -48 22 -46 26 -30 Z" 
            fill="url(#logoGold)"/>
    </g>

    <!-- Golden Key Shaft Leading Upward to the Ring -->
    <path d="M 195 310 C 240 280 320 220 380 190 L 395 205 C 330 240 250 295 210 330 Z"
          fill="url(#logoGold)"/>
    <!-- Key Shaft Highlight -->
    <path d="M 195 310 C 240 280 320 220 380 190 L 385 195 C 325 225 245 285 200 315 Z"
          fill="url(#logoGoldHighlight)"/>
  </g>

  <!-- Right Side: Brand Typography & Slogan -->
  <g transform="translate(480, 240)">
    <!-- PRESTAMOS -->
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Montserrat, sans-serif" 
          font-size="78" 
          font-weight="900" 
          letter-spacing="-0.5px" 
          fill="#0D2E68">
      PRESTAMOS
    </text>

    <!-- FACIL -->
    <text x="0" y="76" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Montserrat, sans-serif" 
          font-size="86" 
          font-weight="900" 
          letter-spacing="1px" 
          fill="#0045A5">
      FACIL
    </text>

    <!-- CRÉDITO RÁPIDO Y SENCILLO -->
    <text x="0" y="125" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Montserrat, sans-serif" 
          font-size="20" 
          font-weight="800" 
          letter-spacing="2.8px" 
          fill="#0D2E68">
      CRÉDITO RÁPIDO Y SENCILLO
    </text>

    <!-- Pink Circular Checkmark Badge at end of Subtitle -->
    <g transform="translate(408, 118)">
      <circle cx="0" cy="0" r="14" fill="url(#logoPink)"/>
      <path d="M -5 0 L -1 4 L 6 -4" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
