<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background squircle -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2B5C"/>
      <stop offset="100%" stop-color="#071738"/>
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="30%" stop-color="#FFCA28"/>
      <stop offset="70%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>

    <!-- Magenta Gradient -->
    <linearGradient id="favPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3388"/>
      <stop offset="60%" stop-color="#E91E63"/>
      <stop offset="100%" stop-color="#AD1457"/>
    </linearGradient>

    <!-- Cyan / Blue Gradient -->
    <linearGradient id="favBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#0080FF"/>
      <stop offset="100%" stop-color="#0044BB"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#favBg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="#2563EB" stroke-width="2.5" opacity="0.4"/>

  <!-- Emblem Scaled & Centered -->
  <g transform="translate(18, 12) scale(0.24)">
    
    <!-- Chart Trendline -->
    <path d="M 50 250 L 110 160 L 145 205 L 205 125" 
          stroke="#002D7A" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 50 250 L 110 160 L 145 205 L 205 125" 
          stroke="url(#favPink)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <polygon points="225,95 180,120 205,145" fill="url(#favPink)"/>

    <!-- Pink Torus Ring -->
    <circle cx="280" cy="140" r="38" fill="none" stroke="url(#favPink)" stroke-width="16"/>

    <!-- Blue Arrow Swooping Through Ring -->
    <path d="M 235 155 C 260 145 290 128 320 110" fill="none" stroke="url(#favBlue)" stroke-width="14" stroke-linecap="round"/>
    <polygon points="340,90 295,108 318,132" fill="url(#favBlue)"/>

    <!-- Golden Key Loop & Shaft -->
    <path d="M 90 240 C 90 200 120 175 160 190 C 190 200 235 165 285 135 L 295 145 C 240 180 195 220 165 205 C 135 190 115 210 115 240 C 115 275 145 295 180 280 C 195 270 205 255 205 235 L 220 240 C 220 270 200 295 175 305 C 125 320 90 290 90 240 Z" 
          fill="url(#favGold)"/>

    <!-- Dollar sign in key loop -->
    <g transform="translate(155, 250) scale(0.65)">
      <rect x="-4" y="-35" width="8" height="70" rx="3" fill="url(#favGold)"/>
      <path d="M 14 -14 C 14 -25 -2 -29 -11 -24 C -17 -21 -19 -13 -14 -7 C -9 -1 5 2 12 7 C 23 13 25 24 17 32 C 9 40 -8 40 -17 30 L -11 21 C -3 27 8 27 12 22 C 15 19 14 13 9 10 C 3 5 -9 2 -15 -2 C -23 -8 -21 -21 -14 -29 C -3 -37 17 -35 20 -23 Z" 
            fill="url(#favGold)"/>
    </g>
  </g>
</svg>
